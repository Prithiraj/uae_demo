name: Generate business website design plans

on:
  push:
    branches: [website-design-plans]
    paths:
      - '.generate-business-plans'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-design-plans
          fetch-depth: 0

      - name: Generate evidence-backed plans
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('business-research')
          START = '<!-- WEBSITE_DESIGN_PLAN_START -->'
          END = '<!-- WEBSITE_DESIGN_PLAN_END -->'

          def grab(text, label):
              m = re.search(r'^- \*\*' + re.escape(label) + r':\*\*\s*(.+)$', text, re.M)
              return m.group(1).strip() if m else 'Not verified in current research file'

          def front(text, key):
              m = re.search(r'^' + re.escape(key) + r':\s*["\']?([^"\'\n]+)', text, re.M)
              return m.group(1).strip() if m else ''

          def section(text, heading):
              m = re.search(r'^## ' + re.escape(heading) + r'\s*\n\n?(.*?)(?=^## |\Z)', text, re.M | re.S)
              return m.group(1).strip() if m else ''

          def clean_value(v):
              return v.replace('`','').strip()

          def category_key(cat):
              c = cat.lower()
              if any(x in c for x in ['beauty salon','hair salon','barber','gents salon']): return 'salon'
              if any(x in c for x in ['restaurant','cafeteria','food','gelato']): return 'food'
              if any(x in c for x in ['grocery','supermarket','minimart']): return 'grocery'
              if any(x in c for x in ['laundry','dry clean']): return 'laundry'
              if any(x in c for x in ['tailor','embroidery']): return 'tailor'
              if any(x in c for x in ['hardware','wholesale','electrical','trading']): return 'trade'
              if any(x in c for x in ['garage','auto repair']): return 'garage'
              if any(x in c for x in ['mobile phone','phone store']): return 'mobile'
              return 'local'

          CFG = {
            'salon': {
              'audience':'Primary: local residents and workers in the surrounding area looking for the verified salon/beauty services. Secondary: customers comparing salons on Maps or verified booking platforms. Treat age, gender and style preferences as hypotheses until the owner confirms them.',
              'direction':'Elegant, luminous, editorial and service-led. Use generous whitespace, close-up texture, real workspace/team photography and refined typography. Avoid generic “luxury salon” clichés unless the actual space supports them.',
              'colors':[('Ivory','#FBF8F5'),('Ink','#241F20'),('Rose clay','#B47B6A'),('Blush','#E9D7CF'),('Sage accent','#657267')],
              'display':'Cormorant Garamond','body':'Inter',
              'shots':['Exterior/storefront','Wide interior','Real team/artist portrait','Service-in-progress close-up','Tools/products actually used (owner-approved)','Finished result only with subject consent'],
              'ia':['Home','Services','Gallery','About / Space & Team','Visit / Contact'],
              'schema':'BeautySalon (or HairSalon only where that is the verified primary category)',
              'sections':['Hero: real salon/barber image, concise evidence-backed positioning, area and primary CTA(s).','Service overview: group only verified services; if the research file lacks a complete menu, the detailed list remains owner-supplied content.','Why choose this business: use only evidenced strengths such as review footprint, booking presence, location consistency or verified service breadth.','Real space / team / process: owner-supplied portraits and interior/work images; no generic stock beauty imagery in production.','Gallery: 6–12 rights-cleared images with meaningful alt text.','Social proof: aggregate rating/review count as-of the research date if platform policy permits; otherwise link to Maps without reproducing review text.','Location / hours / contact: NAP, hours, Maps link and verified social/booking links.','Final CTA: repeat the primary booking/contact action with a short location reassurance.']},
            'food': {
              'audience':'Primary: nearby diners and delivery/takeaway researchers looking for the verified food business. Secondary: visitors comparing nearby options, hours, directions and verified menu/ordering channels.',
              'direction':'Warm, appetite-led and editorial. Lead with real food and real-space photography, readable menu hierarchy and practical visit/order information. Avoid invented signature dishes or cuisine claims.',
              'colors':[('Warm cream','#FFF8EE'),('Espresso','#2B2118'),('Terracotta','#B85C38'),('Olive','#66734D'),('Sand','#E9D9C4')],
              'display':'Fraunces','body':'Inter',
              'shots':['Exterior/signage','Dining/counter space','Representative owner-approved dishes','Preparation/process detail','Team portrait if desired','Packaging/takeaway only if actually offered'],
              'ia':['Home','Menu / Offer (verified only)','Gallery','Story / Space','Visit / Contact'],
              'schema':'Restaurant or FoodEstablishment matching the verified category',
              'sections':['Hero: real food/space image, verified category/location and order/call/directions CTA.','Menu / offer: only verified dishes/categories/prices; if the research does not contain a current menu, require owner-supplied menu data.','Space / process: real kitchen/counter/dining context with rights-cleared photography.','Differentiators: only documented cuisine, operating pattern, ordering footprint or location proof.','Gallery: food and place imagery with truthful alt text.','Social proof: aggregate rating/review count with date/source if policy permits; no copied review text by default.','Location / hours / contact: prominent practical information and exact Maps link.','Final CTA: verified order, call or directions action.']},
            'grocery': {
              'audience':'Primary: households and convenience shoppers in the surrounding area. Secondary: visitors searching for a nearby grocery/supermarket and checking hours, phone and directions. Product assortment remains owner-supplied rather than inferred.',
              'direction':'Friendly neighborhood utility with freshness cues. Prioritize hours, location and practical discovery. Use real shelves/storefront/product-group photography; avoid invented inventory.',
              'colors':[('Fresh white','#F9FCF7'),('Leaf','#244B2A'),('Market green','#4D8A4F'),('Sun accent','#E7B942'),('Neutral gray','#66706A')],
              'display':'Manrope','body':'Inter',
              'shots':['Storefront','Entrance','Aisles','Checkout','Representative owner-approved inventory','Team/store-context shot'],
              'ia':['Home','Store / Product categories (owner-approved)','Gallery','Visit / Contact'],
              'schema':'GroceryStore or ConvenienceStore matching the verified Maps category',
              'sections':['Hero: real storefront/interior image, verified category, area, hours and directions/call CTA.','What you can find: owner-approved product/category list only; do not infer inventory from category.','Convenience proof: verified opening hours, location and review footprint.','Store gallery: entrance, aisles, checkout and representative inventory photographed with permission.','Neighborhood location: map and verified access/landmark details only.','Contact / social: phone and verified social links.','Final CTA: get directions first, call second unless owner data supports another stronger action.']},
            'laundry': {
              'audience':'Primary: households and nearby workers needing laundry/cleaning services. Secondary: customers searching by proximity, opening hours and contact convenience. Do not advertise pickup/delivery unless verified.',
              'direction':'Clean, reassuring and efficient. Bright surfaces, crisp grids, simple process explanation and minimal decorative motion should make trust and contact clarity effortless.',
              'colors':[('Cloud','#F7FBFC'),('Deep teal','#143642'),('Clean blue','#247A8B'),('Mist','#DCEFF4'),('Steel gray','#687B83')],
              'display':'Manrope','body':'Inter',
              'shots':['Storefront','Front counter','Cleaning/pressing equipment','Process detail','Packaged finished garments','Team portrait if desired'],
              'ia':['Home','Services','How it works (after workflow verification)','Gallery','Visit / Contact'],
              'schema':'DryCleaningOrLaundry',
              'sections':['Hero: real storefront/workspace image, verified category, area, hours and contact/directions CTA.','Services: only verified service types; do not add pickup, delivery, express, ironing or pricing unless owner-confirmed.','How it works: a simple process may be added only after the owner confirms the actual workflow.','Trust / proof: rating/review count, status and consistent contact/location evidence where meaningful.','Real process / equipment: rights-cleared actual cleaning, pressing, packaging and storefront photography.','Location / hours / contact: strongest utility section, optimized for mobile/local search.','Final CTA: call/verified messaging/directions, with no unverified turnaround promise.']},
            'tailor': {
              'audience':'Primary: local customers seeking verified tailoring/embroidery services. Secondary: customers comparing workmanship, location and contact convenience. Garment types, turnaround and alterations must be owner-confirmed.',
              'direction':'Craft-led, tactile and editorial. Use real fabric, stitching, tools, workspace and finished-work photography. The visual language should communicate precision without inventing heritage or specialties.',
              'colors':[('Linen','#FAF6EE'),('Charcoal','#252525'),('Burgundy','#713A42'),('Thread gold','#B18A4A'),('Stone','#D8D0C4')],
              'display':'Libre Baskerville','body':'Inter',
              'shots':['Storefront','Tailoring workspace','Fabric/thread/tools','Stitching/process detail','Finished work with permission','Tailor/team portrait'],
              'ia':['Home','Services / Capabilities','Craft / Process','Gallery','Visit / Contact'],
              'schema':'LocalBusiness (use a more specific tailoring type only if supported by the chosen schema vocabulary)',
              'sections':['Hero: real craft/workspace image, verified category/location and contact CTA.','Capabilities: list only verified tailoring/embroidery services or owner-approved additions.','Craft / process: explain the real workflow only after owner verification.','Differentiators: evidence such as location consistency, years/brands/materials only where sourced.','Gallery: actual work and process with customer consent where identifiable.','Location / hours / contact: exact NAP and Maps.','Final CTA: call/message/directions; quote or measurement booking only if owner workflow supports it.']},
            'trade': {
              'audience':'Primary: contractors, workshops, tradespeople and commercial buyers in the surrounding area who need the verified hardware/building-supply/wholesale offer. Secondary: buyers searching exact products or brands once the owner supplies an approved catalog.',
              'direction':'Industrial, credible and specification-first. Clear product/category navigation, strong contact routes and real store/warehouse photography should outweigh decorative storytelling.',
              'colors':[('Industrial white','#F4F5F6'),('Graphite','#1D2328'),('Safety amber','#D97706'),('Steel blue','#526773'),('Concrete','#DDE1E3')],
              'display':'IBM Plex Sans','body':'IBM Plex Sans',
              'shots':['Storefront/warehouse','Shelving/product categories','Tools/materials close-up','Counter/team','Loading/stock context','Verified brands/products only'],
              'ia':['Home','Products / Capabilities','About / Proof','Gallery','Contact / Location'],
              'schema':'HardwareStore where verified; otherwise LocalBusiness for wholesale/supplier profiles',
              'sections':['Hero: real business/workspace image, verified category/area and direct contact/directions CTA.','Product categories / capabilities: publish only categories explicitly supported by research or owner data; no invented brands, prices or warranties.','Differentiators: factual proof such as review footprint, years in business, registered-company evidence, known brands or verified capabilities only.','Real space / process: actual store, workshop, team, tools, materials or work-in-progress photography.','Gallery / proof: practical visual evidence instead of decorative stock imagery.','Location / hours / contact: verified channels only.','Final CTA: direct contact/directions; add quote/availability form only after owner workflow confirmation.']},
            'garage': {
              'audience':'Primary: vehicle owners and nearby businesses looking for the verified garage/auto-repair service. Secondary: drivers comparing nearby repair options based on location, contact and reputation. Repair specialties, makes, pricing and turnaround require owner confirmation.',
              'direction':'Technical, trustworthy and workshop-real. Use real bays, tools, technicians and vehicles with permission. Avoid motorsport/game aesthetics unless the business genuinely supports them.',
              'colors':[('Workshop white','#F5F6F6'),('Carbon','#1F2428'),('Signal red','#B73A32'),('Steel','#68757D'),('Cool gray','#DDE2E5')],
              'display':'Barlow Condensed','body':'Inter',
              'shots':['Exterior/signage','Workshop bays','Tools/diagnostics','Technician at work','Vehicle detail with owner consent','Team portrait'],
              'ia':['Home','Services / Capabilities','Workshop / Process','Gallery','Visit / Contact'],
              'schema':'AutoRepair',
              'sections':['Hero: real workshop image, verified category/location and call/directions CTA.','Services / capabilities: only verified repair/service categories; no invented makes, guarantees or prices.','Workshop proof: real equipment, technicians and process after owner verification.','Differentiators: sourced reputation/location/business facts only.','Gallery: rights-cleared workshop and vehicle imagery with consent.','Location / hours / contact: exact Maps identity and verified contact channels.','Final CTA: call/directions; booking/quote request only if owner workflow supports it.']},
            'mobile': {
              'audience':'Primary: local customers looking for the verified mobile-phone retail business. Secondary: visitors checking location, phone and owner-approved device/accessory categories. Do not imply stock, brands, repair or warranty services without verification.',
              'direction':'Modern retail, clear and product-forward without imitating a specific electronics brand. Use real shop and inventory photography only after owner approval.',
              'colors':[('Bright white','#F8FAFC'),('Midnight','#111827'),('Electric blue','#2563EB'),('Cyan accent','#0891B2'),('Cool gray','#CBD5E1')],
              'display':'Space Grotesk','body':'Inter',
              'shots':['Storefront','Interior/display cases','Owner-approved devices/accessories','Counter/team','Close product detail','Signage/location context'],
              'ia':['Home','Products / Services (owner-approved)','Gallery','Visit / Contact'],
              'schema':'MobilePhoneStore',
              'sections':['Hero: real retail image, verified category/location and call/directions CTA.','Products / services: owner-approved categories only; never infer stock, brands, repair, warranty or trade-in.','Store / team: real place and people photography with permission.','Differentiators: verified location/reputation/business facts.','Gallery: current store and approved product imagery.','Location / hours / contact: exact Maps identity and verified channels.','Final CTA: call/directions; inventory inquiry only after owner confirms fulfillment workflow.']},
            'local': {
              'audience':'Primary: nearby customers looking for this verified local business category. Secondary: visitors comparing nearby alternatives using location, hours, contact and reputation.',
              'direction':'Specific, local and evidence-led. Let the real place, people, products/process and practical customer information determine the visual personality rather than applying a generic template.',
              'colors':[('Warm white','#FAFAF7'),('Ink','#202326'),('Local accent','#356A72'),('Soft accent','#D7E5E5'),('Stone','#737A7C')],
              'display':'Manrope','body':'Inter',
              'shots':['Storefront','Interior/workspace','Team','Verified product/service/process detail','Customer-facing area','Location context'],
              'ia':['Home','Products / Services','About / Process','Gallery','Visit / Contact'],
              'schema':'LocalBusiness, narrowed to the most specific verified subtype available',
              'sections':['Hero: real business image, verified category/location and strongest verified CTA.','Products / services: only research-backed or owner-approved content.','Real space / team / process: actual photography and truthful workflow.','Differentiators: source-backed facts only.','Gallery: rights-cleared real-business imagery.','Location / hours / contact: exact Maps identity and verified channels.','Final CTA: strongest verified action, repeated without adding an unnecessary funnel.']}
          }

          def social_channels(src):
              pairs = re.findall(r'^- \[([^\]]+)\]\(([^)]+)\)', src, re.M)
              out=[]
              for label,url in pairs:
                  l=label.lower(); u=url.lower()
                  if any(x in l+u for x in ['fresha','instagram','facebook','whatsapp','linkedin','zomato','talabat','deliveroo']):
                      out.append((label,url))
              return out

          def plan_for(path):
              original = path.read_text(encoding='utf-8')
              base = original.split(START)[0].rstrip() + '\n'
              code = front(base,'unique_code') or path.name[:4]
              status = clean_value(front(base,'status') or grab(base,'Operational status'))
              name = clean_value(grab(base,'Current Google Maps name'))
              if name.startswith('Not verified'): name = path.stem[5:].replace('-',' ').title()
              cat = clean_value(grab(base,'Current Maps category'))
              csvcat = clean_value(grab(base,'Category in CSV'))
              area = clean_value(grab(base,'Area'))
              address = clean_value(grab(base,'Address'))
              phone = clean_value(grab(base,'Phone'))
              hours = clean_value(grab(base,'Hours'))
              rating = clean_value(grab(base,'Rating'))
              reviews = clean_value(grab(base,'Review count'))
              website_sec = section(base,'Website and digital presence')
              findings = section(base,'Research findings').replace('\n',' ').strip()
              sources = section(base,'Sources')
              channels = social_channels(sources)
              website_m = re.search(r'^- \*\*Website:\*\*\s*(\S+)', website_sec, re.M)
              website = website_m.group(1) if website_m else ''
              website_conclusion = grab(website_sec,'Conclusion') if website_sec else 'Not verified'
              key = category_key(cat + ' ' + csvcat)
              cfg = CFG[key]
              closed = any(x in status.lower() for x in ['closed','permanently'])
              review_n = int(re.sub(r'\D','',reviews) or '0')
              channel_names = ', '.join(x[0] for x in channels) if channels else 'No social/booking channel is sufficiently verified in the current research file.'
              actions=[]
              if channels:
                  fresha = next((u for l,u in channels if 'fresha' in (l+u).lower()), None)
                  whatsapp = next((u for l,u in channels if 'whatsapp' in (l+u).lower()), None)
                  ordering = next((u for l,u in channels if any(x in (l+u).lower() for x in ['zomato','talabat','deliveroo'])), None)
                  if fresha: actions.append('Book appointment through the verified booking profile')
                  if ordering: actions.append('Order / view menu through the verified third-party channel')
                  if whatsapp: actions.append('WhatsApp')
              if phone and not phone.startswith('Not verified'): actions.append('Call')
              actions.append('Get directions')
              actions = list(dict.fromkeys(actions))
              if closed: actions=['Do not publish a conversion CTA until reopening/current operation is owner-verified','Get directions only for internal verification']
              differentiators=[f'Exact Google Maps identity in **{area}** with a stable Place ID.']
              if review_n >= 100: differentiators.append(f'Substantial Maps social-proof footprint: {rating} rating across {reviews} reviews on the research date.')
              if '24 hour' in hours.lower(): differentiators.append('Verified 24-hour operation in the captured Maps snapshot.')
              if website: differentiators.append('An existing independent website is already present; this project should be treated as an upgrade/migration rather than a first website.')
              if channels: differentiators.append('Verified third-party digital presence can support a direct conversion path without inventing a new workflow.')
              if closed: differentiators.append('Current research flags the business as closed; launch must be gated on owner/current-status verification.')
              reputation = (f'The captured Maps footprint ({rating} / {reviews} reviews) is strong enough to support a visible social-proof module, subject to current platform attribution/policy requirements.' if review_n >= 100 else f'Use the captured {rating} / {reviews}-review snapshot cautiously, with date/source attribution if displayed.' if review_n else 'No sufficiently strong review baseline is available for a prominent rating claim.')
              value = f'Proposed evidence-supported positioning: **{name} — {cat.lower()} in {area}, Dubai**, anchored by verified contact/location details.'
              colors='\n'.join(f'- **{n}:** `{v}`' for n,v in cfg['colors'])
              shots='\n'.join(f'- {s}' for s in cfg['shots'])
              ia='\n'.join(f'- **{s}**' for s in cfg['ia'])
              layouts='\n'.join(f'- **{s.split(":",1)[0]}:**{s.split(":",1)[1]}' if ':' in s else f'- {s}' for s in cfg['sections'])
              acts='\n'.join(f'- **{a}**' for a in actions)
              diffs='\n'.join(f'- {d}' for d in differentiators)
              migration = f' Because an existing independent site was found ({website}), first audit its current brand assets, top pages and inbound URLs before replacing anything.' if website else ''
              seo_migration = f' Preserve the existing domain `{website}` where appropriate; crawl current indexed URLs and plan 301 redirects before any redesign/migration.' if website else ''
              impl_extra = f'2. Crawl and audit the existing website ({website}); preserve valuable URLs, analytics/SEO signals and verified brand assets before redesigning.\n3.' if website else '2.'
              gate = '\n- **Launch gate:** current research indicates the business may be closed. Do not launch a customer-conversion website until the owner/current status is re-verified.\n' if closed else ''
              social_line = channel_names
              finding = findings or 'The current research file does not establish an additional differentiator beyond verified identity, contact and location facts.'
              title = f'{name} | {cat} in {area}, Dubai'
              return base + f'''\n{START}\n\n# Website Design Plan\n\n> **Plan only — do not implement yet.** This plan is derived from the evidence already documented above. Any new claim, image, service, price, policy, promotion, testimonial or operational detail must be owner-verified before production.\n\n## 1. Evidence baseline\n\n- **Business:** {name}\n- **Unique code:** `{code}`\n- **Verified Maps category:** {cat}\n- **Area:** {area}\n- **Operational status:** {status}\n- **Address:** {address}\n- **Phone:** {phone}\n- **Hours:** {hours}\n- **Google social proof snapshot:** {rating} from {reviews} Google review(s) as captured on the research date.\n- **Website finding:** {website_conclusion}{(' Verified website: ' + website) if website else ''}\n- **Verified/mentioned digital channels:** {social_line}\n- **Strongest research finding:** {finding}\n- **Evidence-backed value-proposition direction:** {value} Final marketing wording requires owner approval.\n- **Competitive-context note:** No named competitor claim is added unless the current research file already supports one. Before implementation, review 3–5 nearby same-category businesses for navigation, CTA and content-pattern benchmarking; do not copy claims, copy or imagery.\n- **Visual-evidence status:** no production-licensed photography is assumed from Maps/review/directory sources; production imagery must be owner-supplied, commissioned or separately licensed.\n{gate}\n**Evidence-backed differentiators**\n\n{diffs}\n\n**Reputation strategy:** {reputation}\n\n## 2. Audience\n\n{cfg['audience']}\n\nTreat this as a working audience hypothesis based on category and location, not demographic fact. Validate the highest-value customer segment with the owner before final copy.\n\n## 3. Conversion goals\n\n**Primary actions**\n\n{acts}\n\n**Secondary goals**\n\n- Establish trust quickly with real place/team/product/process imagery.\n- Make the verified offer understandable without forcing visitors to hunt through menus.\n- Reduce uncertainty around address, hours and contact details.\n- Convert local-search traffic into the most appropriate verified action rather than adding unnecessary forms.\n\n## 4. Creative direction\n\n{cfg['direction']}\n\nUse the research finding as the visual-story anchor: **{finding}**\n\nDo not assume the palette below matches an existing brand identity; it is a proposed system to validate with the owner.{migration}\n\n## 5. Color system\n\n{colors}\n\n- Maintain WCAG AA contrast for body text and interactive controls.\n- Use the accent color sparingly for primary CTAs, selected states and small highlights—not as large background fields when contrast suffers.\n\n## 6. Typography\n\n- **Display / headings:** `{cfg['display']}`.\n- **Body / UI:** `{cfg['body']}`.\n- Limit production to two font families maximum. Prefer self-hosted WOFF2 files under their open-source licenses, with robust system-font fallbacks.\n- Use a compact type scale on mobile and a more editorial scale on larger screens; do not sacrifice legibility for style.\n\n## 7. Image strategy\n\n**Production priority: real, current business photography. Recommended shot list:**\n\n{shots}\n\n- Owner-supplied or commissioned photography is the preferred production source.\n- Google Maps, Waze, Yango, directory, review-platform and social imagery may be useful as **research reference only**. Do not ship it commercially unless the owner or photographer can prove the necessary rights.\n- Any demo-only/editorial image must be visibly tagged in the project as `DEMO_ONLY_REPLACE_BEFORE_LAUNCH`.\n- Use responsive `<picture>` sources with AVIF/WebP plus a safe fallback, descriptive filenames and meaningful alt text.\n\n## 8. Information architecture\n\n{ia}\n\nKeep the first release shallow: most local-business users should reach the primary action within one tap on mobile and without navigating through multiple nested pages.\n\n## 9. Section-by-section layout\n\n{layouts}\n\n## 10. Three.js / animation plan\n\n- **Three.js: not recommended for v1.** The current evidence does not reveal a business story that needs WebGL to communicate value, and local-business conversion/performance are more important.\n- Use restrained CSS/WAAPI transitions: short fade/translate on section entry, hover/focus feedback and optional image reveal effects.\n- Respect `prefers-reduced-motion: reduce`; remove nonessential motion and never animate core information off-screen.\n- If a future owner-approved concept genuinely benefits from 3D, treat it as progressive enhancement with a static fallback and strict performance budget.\n\n## 11. Responsive behavior\n\n- **Mobile first:** sticky bottom action bar with the top one or two verified actions; do not crowd it with every channel.\n- Hero copy stays short enough that the CTA appears in the first viewport on common phones.\n- Service/menu/product cards stack to one column on small screens, two on tablet and a restrained grid on desktop.\n- Gallery uses touch-friendly swipe/scroll on mobile and a non-janky grid treatment on larger screens.\n- Location/contact content uses tap-to-call and a clear external Maps action.\n- Hours tables remain readable without horizontal scrolling.\n\n## 12. Accessibility\n\n- Target **WCAG 2.2 AA**.\n- Semantic landmarks: `header`, `nav`, `main`, meaningful `section` headings, `footer`.\n- Full keyboard navigation with clearly visible focus states.\n- Minimum 44×44 px touch targets for primary mobile controls.\n- Alt text describes business-relevant image content; decorative images use empty alt text.\n- Forms, if approved later, require explicit labels, error summaries and success states; do not rely on placeholder text.\n- Color is never the only way to communicate status or selection.\n- Reduced-motion behavior is mandatory.\n\n## 13. Performance\n\n- Static-first HTML/CSS with minimal JavaScript; no heavy SPA framework required for a small local-business site unless implementation constraints demand it.\n- No Three.js in the initial build.\n- Set image width/height to prevent layout shift; eager-load only the hero image and lazy-load below-the-fold media.\n- Use AVIF/WebP, responsive `srcset`, sensible compression and CDN caching where available.\n- Defer third-party widgets. Prefer simple links to Maps/social/booking platforms over embedded scripts when possible.\n- Target strong Core Web Vitals on mid-range mobile hardware and real UAE mobile networks, not just desktop Lighthouse.\n\n## 14. SEO / local discovery\n\n- **Proposed title pattern:** `{title}` (shorten if needed to avoid truncation).\n- **Meta description direction:** describe {name} as the verified {cat.lower()} in {area}; include one or two verified service/location facts and end with the primary verified action. Avoid superlatives.\n- Keep name, address and phone consistent with the exact Maps listing after a final pre-launch verification.\n- **JSON-LD:** use `{cfg['schema']}`; include only verified `name`, `address`, `telephone`, `openingHoursSpecification`, `url`, `sameAs` and geo/map identifiers that are actually available.\n- Add canonical URL, Open Graph title/description/image, Twitter card metadata and a rights-cleared social-preview image.\n- Use neighborhood/category language naturally in headings and metadata; do not create doorway pages or keyword-stuffed suburb pages.\n- Link to the exact Google Maps listing for directions. Do not fake reviews or schema ratings.{seo_migration}\n\n## 15. Rights / licensing notes\n\n- Production imagery must be owner-controlled, commissioned or clearly licensed for commercial website use.\n- Directory, Google Maps, social, review and booking-platform images are **not automatically reusable**. Treat them as research references unless rights are documented.\n- Do not copy review text into the site without permission and platform-policy compliance. If aggregate ratings are displayed, label the source/date and follow platform attribution rules.\n- Open-source fonts must retain the applicable license notice in project documentation; self-host only legally redistributable files.\n- Do not reuse competitor copy, layout assets, logos or photography during benchmarking.\n- Obtain consent for identifiable client/team photography, especially treatment, beauty, tailoring or vehicle before/after images.\n\n## 16. Implementation sequence\n\n1. Re-verify Maps status, NAP, hours, website/social links and primary conversion channel with the owner.\n{impl_extra} Collect owner-approved service/menu/product information and all production image assets; mark unresolved content explicitly.\n4. Lock the evidence baseline and content model before visual design.\n5. Create mobile-first wireframes and CTA hierarchy; review against the business goal.\n6. Apply the proposed visual system, then validate it against any real brand materials supplied by the owner.\n7. Implement semantic static-first pages, structured data, metadata and responsive images.\n8. Run accessibility, keyboard, reduced-motion, performance, responsive and link/contact QA.\n9. Owner review and factual sign-off. Only then remove demo-only asset flags and launch.\n\n## 17. Acceptance criteria\n\n- [ ] Every factual business claim can be traced to the evidence above or to a new owner-approved source.\n- [ ] No invented price, service, product, policy, opening hour, testimonial, warranty, delivery/pickup promise or turnaround time appears anywhere.\n- [ ] Primary CTA(s) are obvious in the first mobile viewport and repeated near the end of the page.\n- [ ] All production images have documented usage rights; all demo-only assets are removed before launch.\n- [ ] Name/address/phone/hours match the final verified Maps/owner data.\n- [ ] Responsive layout works at 320 px width through large desktop without horizontal overflow.\n- [ ] Keyboard navigation, focus states, contrast and reduced-motion behavior pass the agreed accessibility QA.\n- [ ] Core page content remains usable if JavaScript fails; no critical business information depends on animation/WebGL.\n- [ ] SEO title, meta description, canonical, Open Graph and appropriate JSON-LD are present and evidence-backed.\n- [ ] No copied third-party review text or unlicensed platform imagery ships to production.\n- [ ] Owner approves the content, visual direction and conversion flow before implementation moves to launch.\n{('- [ ] Existing-site migration preserves or intentionally redirects important public URLs; no verified business content is lost accidentally.\n' if website else '')}\n**Approval checkpoint:** this file now contains the complete design plan for `{code}` / **{name}**. **Do not implement until the plan and current business facts are approved.**\n\n{END}\n'''

          files = sorted(ROOT.glob('*.md'))
          if len(files) != 51:
              raise SystemExit(f'Expected 51 business profiles, found {len(files)}')
          for p in files:
              p.write_text(plan_for(p), encoding='utf-8')
          for p in files:
              t=p.read_text(encoding='utf-8')
              assert t.count(START)==1 and t.count(END)==1, p
              for i in range(1,18): assert f'## {i}.' in t, (p,i)
              assert 'Do not implement' in t, p
          print(f'Generated and validated {len(files)} evidence-backed design plans')
