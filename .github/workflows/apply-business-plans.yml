name: Apply business website plans

on:
  push:
    branches: [website-design-plans]
    paths:
      - '.business-plans-payload.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-design-plans
          fetch-depth: 0
      - name: Apply validated profile set
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .business-plans-payload.b64 > /tmp/business-plans.tar.gz
          rm -rf /tmp/business-plans
          mkdir -p /tmp/business-plans
          tar -xzf /tmp/business-plans.tar.gz -C /tmp/business-plans
          test "$(find /tmp/business-plans/uae_demo_business_research -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 51
          mkdir -p business-research
          cp /tmp/business-plans/uae_demo_business_research/*.md business-research/
          test "$(find business-research -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 51
          for f in business-research/*.md; do
            grep -q '<!-- WEBSITE_DESIGN_PLAN_START -->' "$f"
            grep -q '## 17. Acceptance criteria' "$f"
            grep -qi 'do not implement' "$f"
          done
          rm -f .business-plans-payload.b64 .github/workflows/apply-business-plans.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-research .business-plans-payload.b64 .github/workflows/apply-business-plans.yml
          git commit -m 'Add website design plans to 51 business profiles'
          git push origin HEAD:website-design-plans
