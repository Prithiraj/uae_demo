name: Polish V2 typography

on:
  push:
    branches: [stunning-redesign-v2]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stunning-redesign-v2
          fetch-depth: 0
      - name: Add architecture font families
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/v2.js')
          s=p.read_text(encoding='utf-8')
          marker="  const fam=families[code]||'editorial'; const pal=themes[broad];\n"
          insert=marker+"  const fonts=d.createElement('link');fonts.rel='stylesheet';fonts.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap';d.head.appendChild(fonts);\n"
          if 'fonts.googleapis.com/css2?family=Cormorant' not in s:
              if marker not in s: raise SystemExit('Typography insertion marker missing')
              s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/v2.js
          grep -q 'Cormorant+Garamond' assets/v2.js
          grep -q 'Space+Grotesk' assets/v2.js
      - name: Commit typography polish
        run: |
          rm -f .github/workflows/v2-typography-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish distinct microsite typography'
          git push origin HEAD:stunning-redesign-v2
