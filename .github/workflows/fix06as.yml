name: Fix 06AS plan

on:
  push:
    branches:
      - website-design-plans
    paths:
      - .fix-06as-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-design-plans
      - name: Apply correction
        run: python3 fix06as.py
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-research/06AS-*.md
          git commit -m 'Correct 06AS plan for verified wholesale category'
          git push origin HEAD:website-design-plans
