name: Apply stunning V2 microsite redesign

on:
  push:
    branches: [stunning-redesign-v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stunning-redesign-v2
          fetch-depth: 0

      - name: Reconstruct V2 renderer
        shell: bash
        run: |
          cat .v2-chunk-00 .v2-chunk-01 .v2-chunk-02 | base64 -d | gzip -d > site-builder/build_sites_v2.py
          python -m py_compile site-builder/build_sites_v2.py

      - name: Generate 51 distinct microsites
        run: python site-builder/build_sites_v2.py

      - name: Validate design diversity and content integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          mds=list((root/'business-research').glob('*.md'))
          if len(mds)!=51: raise SystemExit(f'Expected 51 research files, found {len(mds)}')
          codes=[]
          for p in mds:
              m=re.search(r'unique_code: "([^"]+)"',p.read_text(encoding='utf-8'))
              if not m: raise SystemExit(f'Missing code: {p}')
              codes.append(m.group(1))
          missing=[c for c in codes if not (root/c/'index.html').is_file()]
          if missing: raise SystemExit(f'Missing routes: {missing}')
          families={}
          for c in codes:
              text=(root/c/'index.html').read_text(encoding='utf-8')
              m=re.search(r'data-family="([^"]+)"',text)
              if not m: raise SystemExit(f'No architecture family on {c}')
              families.setdefault(m.group(1),[]).append(c)
              if 'prototype' in text.lower(): raise SystemExit(f'Stale template language on {c}')
              if f'https://prithiraj.github.io/uae_demo/{c}/' not in text: raise SystemExit(f'Bad canonical on {c}')
          if len(families)<8: raise SystemExit(f'Insufficient architecture diversity: {families.keys()}')
          concepts=list((root/'assets'/'concepts').glob('*.svg'))
          if len(concepts)!=51: raise SystemExit(f'Expected 51 concept artworks, got {len(concepts)}')
          required={
              'XF68':'data-family="collage"',
              '99FB':'data-family="cinematic"',
              '06AS':'data-family="catalog"',
              'MA03':'data-family="graphic"',
              '2ZSW':'data-family="archival"',
              '01ZE':'Concept artwork',
          }
          for code,needle in required.items():
              text=(root/code/'index.html').read_text(encoding='utf-8')
              if needle not in text: raise SystemExit(f'{code} missing {needle}')
          closed=(root/'2ZSW'/'index.html').read_text(encoding='utf-8')
          if 'informational, not a sales listing' not in closed: raise SystemExit('Closed-business safeguard missing')
          if 'tel:' in closed: raise SystemExit('Closed business unexpectedly has telephone CTA')
          print('Validated',len(codes),'routes across',len(families),'architectures:',', '.join(sorted(families)))
          PY

      - name: Commit only production redesign files
        shell: bash
        run: |
          rm -f .v2-chunk-00 .v2-chunk-01 .v2-chunk-02 .github/workflows/apply-stunning-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign 51 microsites with distinct visual identities'
          git push origin HEAD:stunning-redesign-v2
