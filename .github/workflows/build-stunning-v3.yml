name: Build stunning V3 microsites

on:
  push:
    branches: [stunning-redesign-v3]
    paths:
      - 'site-builder/build_sites_v3.py'
      - '.github/workflows/build-stunning-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v6
        with:
          ref: stunning-redesign-v3
          fetch-depth: 0

      - name: Generate all business sites
        run: python site-builder/build_sites_v3.py

      - name: Validate V3 output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          profiles=sorted((root/'business-research').glob('*.md'))
          codes=[]; closed=[]
          for p in profiles:
              t=p.read_text(encoding='utf-8')
              m=re.search(r'unique_code: "([^"]+)"',t)
              if not m: raise SystemExit(f'Missing unique code: {p}')
              code=m.group(1); codes.append(code)
              if re.search(r'^status: "Permanently closed"',t,re.M) or '**Operational status:** Permanently closed' in t:
                  closed.append(code)
          if len(codes)!=51 or len(set(codes))!=51:
              raise SystemExit(f'Expected 51 unique codes, got {len(codes)} / {len(set(codes))}')
          families=[]; seeds=[]; concepts=0; real=0
          for code in codes:
              p=root/code/'index.html'
              if not p.is_file(): raise SystemExit(f'Missing route: {code}')
              text=p.read_text(encoding='utf-8')
              fm=re.search(r'data-family="([^"]+)"',text); sm=re.search(r'--seed:([0-9]+)',text)
              if not fm or not sm: raise SystemExit(f'Missing V3 design DNA: {code}')
              families.append(fm.group(1)); seeds.append((code,sm.group(1),fm.group(1)))
              if '../assets/v3.css' not in text or '../assets/v3.js' not in text: raise SystemExit(f'V3 assets missing: {code}')
              if 'Google Maps' not in text: raise SystemExit(f'Map source missing: {code}')
              if 'CONCEPT ARTWORK · NOT A BUSINESS PHOTO' in text: concepts+=1
              if 'demo/editorial' in text.lower(): real+=1
              if code in closed and 'tel:' in text: raise SystemExit(f'Closed business has phone conversion CTA: {code}')
          if len(set(families)) < 9: raise SystemExit(f'Not enough distinct architectures: {set(families)}')
          if concepts < 10: raise SystemExit(f'Expected concept-art fallbacks; only {concepts}')
          if real < 30: raise SystemExit(f'Expected substantial real-photo coverage; only {real}')
          if not (root/'assets/v3.css').is_file() or not (root/'assets/v3.js').is_file(): raise SystemExit('Missing V3 shared assets')
          print('Validated 51 routes')
          print('Architectures:', sorted(set(families)))
          print('Concept-art routes:', concepts, 'real-photo routes:', real)
          PY

      - name: Commit generated redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html assets/v3.css assets/v3.js -- */index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate 51 distinct V3 business microsites'
            git push origin HEAD:stunning-redesign-v3
          fi
