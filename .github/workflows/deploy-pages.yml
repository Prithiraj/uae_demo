name: Deploy business microsites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets _site/assets
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('.')
          out = Path('_site')
          profiles = sorted((root / 'business-research').glob('*.md'))
          codes = []
          for profile in profiles:
              text = profile.read_text(encoding='utf-8')
              match = re.search(r'unique_code: "([^"]+)"', text)
              if not match:
                  raise SystemExit(f'Missing unique_code in {profile}')
              codes.append(match.group(1))

          if len(codes) != 51 or len(set(codes)) != 51:
              raise SystemExit(f'Expected 51 unique business codes, found {len(codes)} / {len(set(codes))}')

          for code in codes:
              source = root / code
              if not (source / 'index.html').is_file():
                  raise SystemExit(f'Missing site for {code}')
              shutil.copytree(source, out / code, dirs_exist_ok=True)

          print(f'Staged {len(codes)} business microsites for Pages.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
